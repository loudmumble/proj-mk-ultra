# PROJ-MK-ULTRA Configuration
# SUSPICIOUS Framework - User Configuration
# This file is sourced by scripts as bash. Keys MUST be valid variable names
# (UPPERCASE_UNDERSCORE - hyphens are not valid in bash assignments).
# TARGET_DISK accepts a bare device name (e.g. "sdb") or a stable by-id path
# (/dev/disk/by-id/usb-... - survives USB letter flips); CHILD_*_DEVICE are
# full paths - by-id RECOMMENDED (letter flips observed twice on the reference build).

# Host Configuration
CORE_HOST_FILESYSTEM="btrfs"
SECURITY_LEVEL="basic"

# Leapfrog Filesystem Diversity
CHILD_LEAPFROG_FS_ENABLE="false"
CHILD_LEAPFROG_FS="ext4"
CHILD_LEAPFROG_ALT="btrfs"

# Cross-Distro Support
CROSS_DISTRO_ENABLE="false"
CHILD_DISTRO="arch"

# Installation Target
INSTALL_TARGET="secondary-disk"

# Child Kernel Configuration
CHILD_ROOT_SIZE="10G"
CHILD_BOOT_SIZE="512M"
CHILD_DATA_SIZE="100%"

# Security Settings
MODULE_SIGNING_ENFORCE="true"
IOMMU_VERIFY="true"
CAPABILITY_DROPPING="true"
FILESYSTEM_ISOLATION="true"
NETWORK_ISOLATION="true"

# Detection Settings
BOOT_INTEGRITY_MONITOR="true"
HARDWARE_ISOLATION_MONITOR="true"
SYSFS_ACCESS_MONITOR="true"
MODULE_LOADING_MONITOR="true"
BEHAVIORAL_ANOMALY_DETECTION="true"

# Response Settings
AUTO_DESTROY_ON_DETECTION="true"
PRESERVE_USER_DATA="true"
FORENSIC_LOGGING="true"
RECOVERY_PROCEDURES="true"

# Update Settings
AUTO_UPDATE_MAINSTREAM="false"
AUTO_UPDATE_MULTIKERNEL="false"
AUTO_SYNC_CHILD="false"

# Btrfs Snapshot Settings (Advanced)
BTRFS_SNAPSHOT_ENABLE="false"
BTRFS_SNAPSHOT_KEEP="5"

# Disk Configuration (populated by partition-disk.sh)
TARGET_DISK="sdb"
CHILD_BOOT_DEVICE="/dev/sdb1"
CHILD_ROOT_DEVICE="/dev/sdb2"
CHILD_DATA_DEVICE="/dev/sdb3"

# Child Instance Hardware Assignment
# CHILD_CPU_MASK: hex bitmask of CPUs owned by the child (0xFFFFFFF0 = host
#   keeps CPUs 0-3, child takes every other core; extra bits beyond the CPU
#   count are harmless)
# CHILD_MEMORY_SIZE: dedicated RAM for the child - MUST sit in ZONE_MOVABLE
#   at host boot via kernel param (reference: movablecore=116G on a 128GB
#   host - ZONE_MOVABLE must exceed CHILD_MEMORY_SIZE by ~36G scan slack or
#   the contig window cannot dodge pinned early pages; the spawn preflight
#   will abort if the zone is too small)
# PASSTHROUGH_PCI_DEVICES: PCI slots handed to child. Default 01:00.0 = the
#   GPU (display handoff: the child owns the display while it runs - host
#   console goes headless, SSH is the host's control channel). For USB-root
#   child deployments append the USB controller, e.g. "01:00.0 00:14.0"
#   (child then also gets keyboard/mouse/SD reader). Reclaim happens when
#   the child exits.
CHILD_CPU_MASK="0xFFFFFFF0"
CHILD_MEMORY_SIZE="81917M"
# MOVABLECORE: the ZONE_MOVABLE size the boot entry reserves (the multikernel
# pool source). Must exceed CHILD_MEMORY_SIZE by scan slack (reference: +36G
# on the 128GB build). The wizard syncs the mk boot entry to this value.
MOVABLECORE="116G"
PASSTHROUGH_PCI_DEVICES="01:00.0"
SPAWN_KEEP_BOUND="true"
MEMORY_RESERVATION_ACKNOWLEDGED="false"

# Child Kernel Image (auto-discovered from /boot if empty)
CHILD_KERNEL_PATH=""
CHILD_INITRD_PATH=""
